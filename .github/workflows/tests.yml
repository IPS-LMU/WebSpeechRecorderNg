# Tests for the receiver, the library and the editor, plus the theme audit on the editor's
# routes. The jobs are independent so a receiver failure does not hide a library regression
# (and the reverse).
name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    name: Server (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The receiver is Node builtins only: no install step is needed.
      # The explicit file list, not `server/`: Node 22's runner treats a directory argument as an
      # entry module (`MODULE_NOT_FOUND`) — it only learned to scan one in a later major — so the
      # directory form passes on a new local Node and fails on the version this job pins. Verified
      # on node 22.23.3: `node --test server/` is 1 test / 1 fail, the glob is 60 / 60.
      - name: Receiver tests
        run: node --test server/*.test.mjs
      # The two trees this project owns outright: an export nothing names is either wired up or
      # deleted (bin/dead_exports.mjs). The recorder library is not scanned - it is upstream code,
      # and public-api.ts makes its exports reachable for consumers rather than callers.
      - name: No unreferenced exports
        run: node bin/dead_exports.mjs --verbose
      # The file all of this runs from. A job appended by hand with one wrong indent turns every check
      # in the repository off without any of them reporting it, so its shape is checked here
      # (bin/workflow_check.mjs).
      - name: Workflow structure
        run: node bin/workflow_check.mjs --verbose

  library:
    name: Library (karma)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # The runner image ships Chrome, which `ChromeHeadless` picks up.
      - name: Library suite
        run: npm run test_module -- --watch=false --browsers=ChromeHeadless
      # The library is the deliverable the recorder consumes, and ng-packagr is the pipeline that
      # breaks on a bad `public-api`, an entry point or a budget — none of which karma compiles.
      # The version file it regenerates must match what is committed (plan §11.30).
      - name: Library package build
        run: |
          npm run build_module
          git diff --exit-code -- projects/speechrecorderng/src/lib/spr.module.version.ts
      # What the built package promises its consumers, which nothing here does: every path the
      # manifest names exists in the package — the theme subpath is one this work had to add — and
      # every external import in the shipped bundle is a declared dependency or peer (plan §11.44).
      - name: Package shape
        run: node bin/package_check.mjs
      # Every key of en.json in every locale, every SPR_STRINGS key overridable, every key the source
      # references present, and the committed strings identical to what the generator produces — a
      # check that existed but that nothing ran (plan §11.25).
      - name: i18n validation
        run: |
          npm run validate:i18n
          npm run build:i18n
          git diff --exit-code -- src/assets/i18n

  editor:
    name: Editor (karma + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # The editor's specs read the FILES fixtures and the shared check corpus from the
      # assets the karma target serves; the library suite above must stay green.
      - name: Editor suite
        run: npm run test_editor -- --watch=false --browsers=ChromeHeadless
      # The house rules that are text, not a rendered property: a font size off the --spr-type-*
      # scale, a colour literal outside a var() fallback, a click handler on a div.
      - name: Editor house-rule lint
        run: node bin/editor_lint.mjs --verbose
      # Production is the configuration with the REST base, so this also proves the
      # environment replacement and the budgets.
      - name: Editor production build
        run: npm run build_editor

  audit:
    name: Theme audit (editor routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Every screen the router exposes must be exercised by the audits, and every audited URL must
      # be a screen the router renders. Both directions have failed: the bank + draw-rule route was
      # unaudited and its dark scheme was broken (§11.45), and a renamed route leaves an audit line
      # pointing at a URL that renders nothing to find faults in. Static, so it needs no browser.
      - name: Route coverage
        run: node bin/route_check.mjs
      # One step: the dev server and the browser must stay alive until the audits have run
      # (a background process does not survive the end of the step that started it).
      - name: Audit the editor routes
        run: |
          set -e
          npm run start_editor -- --port 4300 > /tmp/editor-dev.log 2>&1 &
          google-chrome --headless=new --remote-debugging-port=9333 --user-data-dir=/tmp/cdp about:blank > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 180); do
            curl -sf -o /dev/null http://127.0.0.1:4300/project/Demo1/script && break
            sleep 1
          done
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9333/json/version && break
            sleep 1
          done
          # The library list, the editor (outline/centre/inspector), the preview mock, and one
          # state behind an interaction: the inspector with a draw rule selected.
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script --viewports 1366x768,1920x1080
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/1245/edit --viewports 1366x768,1920x1080
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/playback/preview --viewports 1366x768,1920x1080
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/edit --prepare bin/audit/open-draw-rule.js --viewports 1366x768,1920x1080
          # The centre's *selected* card. A URL selects the node (`?sel=g:0:0`), but a URL cannot
          # throw, so the fixture asserts a selection marker is on the page — the non-text rule
          # (§11.54) measures the marker rather than the default screen, or the audit fails.
          node bin/theme_audit.mjs --url 'http://127.0.0.1:4300/project/Demo1/script/bank-draw/edit?sel=g:0:0' --prepare bin/audit/open-centre-state.js --viewports 1366x768
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/bank --viewports 1366x768,1920x1080
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/draws --viewports 1366x768,1920x1080
          # The dedicated bank + draw-rule screen. It renders without any interaction, yet it was on
          # the manual list only — and it was the one editor screen whose dark scheme was broken
          # (plan §11.45).
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/bank/g:0:0 --viewports 1366x768,1920x1080
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/draws --viewports 1366x768,1920x1080
          # A phone width as well: the editor stacks its three columns below 820 px and the bank below
          # 1100 px, and the shell hides its own overflow, so a screen that does not fit or does not
          # reflow shows up here (plan §11.14).
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script --viewports 390x844
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/1245/edit --viewports 390x844
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/edit --viewports 390x844
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/bank --viewports 390x844
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/draws --viewports 390x844
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/playback/preview --viewports 390x844
          # ui-spec's house rule covers light *and* dark: the same routes again with the opt-in dark
          # scheme switched on (`bin/audit/use-dark-scheme.js`), which is where the link token and the
          # timeline's hatch were failing before §11.13.
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/1245/edit --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/playback/preview --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/edit --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js,bin/audit/open-draw-rule.js
          node bin/theme_audit.mjs --url 'http://127.0.0.1:4300/project/Demo1/script/bank-draw/edit?sel=g:0:0' --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js,bin/audit/open-centre-state.js
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/bank --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/draws --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/bank/g:0:0 --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/draws --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          # The machine-checkable part of ui-spec §8: accessible names, labels, ARIA relationships,
          # tree/radiogroup semantics, tab order and 44 px target sizes, on the same routes.
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/1245/edit --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/playback/preview --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/edit --prepare bin/audit/open-draw-rule.js --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/bank --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/draws --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/bank/g:0:0 --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/draws --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/1245/source --viewports 1366x768
          # The selected state's accessibility: `aria-current` on the current row, the active card's
          # names and target sizes — none of which the unselected routes above render.
          node bin/a11y_audit.mjs --url 'http://127.0.0.1:4300/project/Demo1/script/bank-draw/edit?sel=g:0:0' --prepare bin/audit/open-centre-state.js --viewports 1366x768
          # The same routes in the dark scheme: the house rule covers both, and a scheme changes
          # which surfaces the colours land on.
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/draws --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          # The editor at a phone width: the columns stack there, and the tab order must follow.
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/1245/edit --viewports 390x844
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script --viewports 390x844
          # The audits are the gates the screens are held to, so check that they bite. The fixture
          # plants one violation per documented rule; this fails if the audit passes anyway or if it
          # does not name one of them. README §7's sensitivity claims were prose before this.
          theme_out=$(node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script \
            --prepare bin/audit/plant-violations.js --viewports 1366x768 2>&1) && theme_status=0 || theme_status=$?
          if [ "${theme_status:-1}" = "0" ]; then
            echo "the theme audit passed with planted violations"; echo "$theme_out"; exit 1
          fi
          for expected in 'lightgrey' '9px' 'contrast 2.96:1' 'renders in Arial' 'document scrolls' \
            'state marker (is-selected) border contrast' \
            'did not load (natural size 0)' 'has no alt text' 'renders 5px tall (expected 16-64)' \
            'aspect ratio changed (4.00 vs natural 1.00)' 'is outside the viewport'; do
            echo "$theme_out" | grep -q "$expected" || {
              echo "the theme audit did not name: $expected"; echo "$theme_out"; exit 1; }
          done
          a11y_out=$(node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script \
            --prepare bin/audit/plant-violations.js --viewports 1366x768 2>&1) && a11y_status=0 || a11y_status=$?
          if [ "${a11y_status:-1}" = "0" ]; then
            echo "the accessibility audit passed with planted violations"; echo "$a11y_out"; exit 1
          fi
          for expected in 'exposes a button with no name' 'is 17 px high' 'has no lang attribute' \
            '2 h1 heading(s)' '2 main landmark(s)' 'tabindex=3' 'a control inside a control' \
            'id "planted-duplicate-id" appears 2 times' 'has no alt and is not marked decorative' \
            'is aria-hidden but contains focusable content'; do
            echo "$a11y_out" | grep -qF "$expected" || {
              echo "the accessibility audit did not name: $expected"; echo "$a11y_out"; exit 1; }
          done
          # And the two theme rules a page of the application cannot show: with no token layer at all
          # the audit must say so, and the Material pins must be reported as unfollowed rather than
          # skipped. A page that is not the application is exactly that state, so this needs no
          # fixture - pointing it at the app makes both assertions fail, which is the check on them.
          tokens_out=$(node bin/theme_audit.mjs --url http://127.0.0.1:4300/favicon.ico --viewports 1366x768 2>&1) \
            && tokens_status=0 || tokens_status=$?
          if [ "${tokens_status:-1}" = "0" ]; then
            echo "the theme audit passed on a page with no token layer"; echo "$tokens_out"; exit 1
          fi
          for expected in 'no --spr-* tokens are defined (token layer inert)' \
            'does not follow --spr-primary'; do
            echo "$tokens_out" | grep -qF "$expected" || {
              echo "the theme audit did not name: $expected"; echo "$tokens_out"; exit 1; }
          done
          echo "both audits named every planted violation, and the token layer itself"

  dry-run:
    name: Recorder dry run (Chrome, fake media)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # The driver drives the production bundle, so this job also proves the app build.
      - name: Build the recorder
        run: npm run build
      # The receiver serves the built bundle and creates session 1 from the fixture script; Chrome
      # feeds it a fake media stream. One step, because a background process does not survive the
      # end of the step that started it.
      - name: Drive a session end to end
        run: |
          set -e
          # The step's own scratch state. A runner starts with none, but running this step twice locally
          # leaves a completed session behind, and the driver then meets a session it does not expect:
          # measured, `start: play_arrow Starta uppspelning` and `session: status=COMPLETED`, with every
          # clip "never played". Clearing it costs nothing and makes the step reproducible.
          rm -rf /tmp/dryrun /tmp/receiver.log /tmp/chrome.log
          # Chrome will not advance an audio clip's clock without an output device, so no prompt clip
          # can play; the recorder reports that as a failure rather than stalling on it (it bounds
          # the wait). Give the runner a null sink so the clip-relative checks are checked here too.
          # Best effort: without it the driver measures the frozen clock, drives the run anyway and
          # marks those checks unverified instead of blaming the recorder (bin/audit/dry_run.mjs).
          if ! pactl info > /dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq pulseaudio > /dev/null 2>&1 || true
          fi
          pulseaudio --start --exit-idle-time=-1 --disallow-exit > /dev/null 2>&1 || true
          pactl load-module module-null-sink sink_name=null_out > /dev/null 2>&1 || true
          pactl set-default-sink null_out > /dev/null 2>&1 || true
          node server/server.mjs --port 8391 --data /tmp/dryrun --seed src/test \
            --app dist/cavox/browser --project Demo1 --script playback --quiet > /tmp/receiver.log 2>&1 &
          google-chrome --headless=new --remote-debugging-port=9333 --user-data-dir=/tmp/cdp-dry \
            --use-fake-ui-for-media-stream --use-fake-device-for-media-stream \
            --autoplay-policy=no-user-gesture-required about:blank > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf -o /dev/null http://127.0.0.1:8391/api/v1/version && break
            sleep 1
          done
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9333/json/version && break
            sleep 1
          done
          # The driver first, on the session it expects: the migrate above created it and nothing has
          # loaded it yet. The audits and the probe below visit the same pages and leave the session
          # loaded and connected, which is not the state the driver's first take is written for.
          node bin/audit/dry_run.mjs --base http://127.0.0.1:8391 --port 9333 --session 1
          # The recorder's own screens, which the editor-scoped audit job never renders: the token,
          # contrast, type-size and layout rules apply to them too (the redesign is shared), and the
          # *logo* rules — loaded, alt text, height, inside the viewport — only ever fire here, on the
          # recorder's control bar (plan §11.26).
          node bin/theme_audit.mjs --url http://127.0.0.1:8391/spr/session/1 --viewports 1366x768
          node bin/theme_audit.mjs --url http://127.0.0.1:8391/ --viewports 1366x768
          node bin/theme_audit.mjs --url http://127.0.0.1:8391/spr/respondent/1 --viewports 1366x768
          # The recorder's screens against the rules that hold anywhere — names, labels, ids, alt,
          # ARIA, the tree, tab order, nesting, a quiet console. The editor's house rules (44 px
          # targets, one h1, one main) are scoped out: the recorder predates them (plan §11.28).
          node bin/a11y_audit.mjs --url http://127.0.0.1:8391/spr/session/1 --viewports 1366x768 --rules universal
          node bin/a11y_audit.mjs --url http://127.0.0.1:8391/ --viewports 1366x768 --rules universal
          node bin/a11y_audit.mjs --url http://127.0.0.1:8391/spr/respondent/1 --viewports 1366x768 --rules universal
          # The same three screens at a phone width. The editor's routes have had this pass since
          # §11.14 showed what an unmeasured narrow screen does; the recorder's had none.
          node bin/theme_audit.mjs --url http://127.0.0.1:8391/spr/session/1 --viewports 390x844
          node bin/theme_audit.mjs --url http://127.0.0.1:8391/spr/respondent/1 --viewports 390x844
          node bin/theme_audit.mjs --url http://127.0.0.1:8391/ --viewports 390x844
          node bin/a11y_audit.mjs --url http://127.0.0.1:8391/spr/session/1 --viewports 390x844 --rules universal
          node bin/a11y_audit.mjs --url http://127.0.0.1:8391/spr/respondent/1 --viewports 390x844 --rules universal
          node bin/a11y_audit.mjs --url http://127.0.0.1:8391/ --viewports 390x844 --rules universal
          # And in the opt-in dark scheme at 1366x768, where §11.13's contrast failures were found -
          # the editor's routes have had that pass since then, the recorder's none.
          node bin/theme_audit.mjs --url http://127.0.0.1:8391/spr/session/1 --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/theme_audit.mjs --url http://127.0.0.1:8391/spr/respondent/1 --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/theme_audit.mjs --url http://127.0.0.1:8391/ --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/a11y_audit.mjs --url http://127.0.0.1:8391/spr/session/1 --viewports 1366x768 --rules universal --prepare bin/audit/use-dark-scheme.js
          node bin/a11y_audit.mjs --url http://127.0.0.1:8391/spr/respondent/1 --viewports 1366x768 --rules universal --prepare bin/audit/use-dark-scheme.js
          node bin/a11y_audit.mjs --url http://127.0.0.1:8391/ --viewports 1366x768 --rules universal --prepare bin/audit/use-dark-scheme.js
          # The stage's instruction line, and which marks the branding slots actually show, measured
          # rather than eyeballed: the tool exits non-zero when the line sits off the header's centre
          # beyond a pixel, when a page has no stage, or when the status line does not fit. The
          # respondent mirror is measured too, where the same line is set at the larger caption.
          node bin/layout_probe.mjs --url http://127.0.0.1:8391/spr/session/1 --mirror http://127.0.0.1:8391/spr/respondent/1 --viewports 1568x986,1280x800
          # The probe's three failure modes, so the tool cannot stop biting: a page with no stage must be
          # reported as such - it used to crash on one, building its log line from a viewport that a
          # state report does not carry - a line off the centre must fail at zero tolerance, and a status
          # line whose content is wider than its box must be named. The first two need no fixture.
          nopage_out=$(node bin/layout_probe.mjs --url http://127.0.0.1:8391/recorder/session/1 --viewports 1568x986 2>&1) \
            && nopage_status=0 || nopage_status=$?
          if [ "${nopage_status:-0}" = "0" ]; then
            echo "the probe passed a page with no stage"; echo "$nopage_out"; exit 1
          fi
          echo "$nopage_out" | grep -qF 'no stage on the page' || {
            echo "the probe did not report the missing stage"; echo "$nopage_out"; exit 1; }
          tight_out=$(node bin/layout_probe.mjs --url http://127.0.0.1:8391/spr/session/1 --viewports 1568x986 --tolerance 0 2>&1) \
            && tight_status=0 || tight_status=$?
          if [ "${tight_status:-0}" = "0" ]; then
            echo "the probe passed an off-centre line at zero tolerance"; echo "$tight_out"; exit 1
          fi
          echo "$tight_out" | grep -qF 'outside tolerance' || {
            echo "the probe did not report the off-centre line"; echo "$tight_out"; exit 1; }
          status_out=$(node bin/layout_probe.mjs --url http://127.0.0.1:8391/spr/session/1 \
            --prepare bin/audit/plant-status-overflow.js --viewports 1568x986 2>&1) \
            && status_status=0 || status_status=$?
          if [ "${status_status:-0}" = "0" ]; then
            echo "the probe passed a status line wider than its box"; echo "$status_out"; exit 1
          fi
          echo "$status_out" | grep -qF 'statusFits=false' || {
            echo "the probe did not report the unreadable status line"; echo "$status_out"; exit 1; }
          echo "the layout probe reports all three failure modes"

  detail-view:
    name: Recorder detail view (development build, Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # The overlay no production bundle can be probed for: bin/audit/open-detail-view.js opens the
      # waveform and sonagram pane through Angular's development API, and the page is the recorder's
      # own `/recorder/session/1` route. One step, because a background process does not survive the
      # end of the step that started it.
      - name: Audit the detail view
        run: |
          set -e
          npx ng build --configuration development --output-path=/tmp/devapp
          node server/server.mjs --port 8391 --data /tmp/detailrun --seed src/test --app none \
            --project Demo1 --script playback --migrate
          node server/server.mjs --port 8391 --data /tmp/detailrun --seed src/test \
            --app /tmp/devapp/browser --project Demo1 --script playback --quiet > /tmp/receiver.log 2>&1 &
          google-chrome --headless=new --remote-debugging-port=9333 --user-data-dir=/tmp/cdp-detail \
            --use-fake-ui-for-media-stream --use-fake-device-for-media-stream \
            --autoplay-policy=no-user-gesture-required about:blank > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 180); do
            curl -sf -o /dev/null http://127.0.0.1:8391/recorder/session/1 && break
            sleep 1
          done
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9333/json/version && break
            sleep 1
          done
          node bin/theme_audit.mjs --url http://127.0.0.1:8391/recorder/session/1 \
            --prepare bin/audit/open-detail-view.js --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:8391/recorder/session/1 \
            --prepare bin/audit/open-detail-view.js --viewports 1366x768 --rules universal
          # The error dialog too, through the recorder's own error path. Rule 6 is skipped here and
          # nothing else: with a modal open Angular Material marks the application root `aria-hidden`
          # while its focus trap keeps Tab inside the dialog - measured, four presses all landed on the
          # dialog's button - so that rule cannot tell the pattern from a real violation and would
          # report the framework. Skipping it is written in the command, where it is visible, and every
          # other rule runs against the dialog.
          node bin/theme_audit.mjs --url http://127.0.0.1:8391/recorder/session/1 \
            --prepare bin/audit/open-error-dialog.js --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:8391/recorder/session/1 \
            --prepare bin/audit/open-error-dialog.js --viewports 1366x768 --rules universal --except 6
