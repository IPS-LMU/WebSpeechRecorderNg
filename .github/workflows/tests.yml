# Tests for the receiver, the library and the editor, plus the theme audit on the editor's
# routes. The jobs are independent so a receiver failure does not hide a library regression
# (and the reverse).
name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    name: Server (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The receiver is Node builtins only: no install step is needed.
      - name: Receiver tests
        run: node --test server/

  library:
    name: Library (karma)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # The runner image ships Chrome, which `ChromeHeadless` picks up.
      - name: Library suite
        run: npm run test_module -- --watch=false --browsers=ChromeHeadless
      # The library is the deliverable the recorder consumes, and ng-packagr is the pipeline that
      # breaks on a bad `public-api`, an entry point or a budget — none of which karma compiles.
      # The version file it regenerates must match what is committed (plan §11.30).
      - name: Library package build
        run: |
          npm run build_module
          git diff --exit-code -- projects/speechrecorderng/src/lib/spr.module.version.ts
      # Every key of en.json in every locale, every SPR_STRINGS key overridable, every key the source
      # references present, and the committed strings identical to what the generator produces — a
      # check that existed but that nothing ran (plan §11.25).
      - name: i18n validation
        run: |
          npm run validate:i18n
          npm run build:i18n
          git diff --exit-code -- src/assets/i18n

  editor:
    name: Editor (karma + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # The editor's specs read the FILES fixtures and the shared check corpus from the
      # assets the karma target serves; the library suite above must stay green.
      - name: Editor suite
        run: npm run test_editor -- --watch=false --browsers=ChromeHeadless
      # The house rules that are text, not a rendered property: a font size off the --spr-type-*
      # scale, a colour literal outside a var() fallback, a click handler on a div.
      - name: Editor house-rule lint
        run: node bin/editor_lint.mjs --verbose
      # Production is the configuration with the REST base, so this also proves the
      # environment replacement and the budgets.
      - name: Editor production build
        run: npm run build_editor

  audit:
    name: Theme audit (editor routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # One step: the dev server and the browser must stay alive until the audits have run
      # (a background process does not survive the end of the step that started it).
      - name: Audit the editor routes
        run: |
          set -e
          npm run start_editor -- --port 4300 > /tmp/editor-dev.log 2>&1 &
          google-chrome --headless=new --remote-debugging-port=9333 --user-data-dir=/tmp/cdp about:blank > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 180); do
            curl -sf -o /dev/null http://127.0.0.1:4300/project/Demo1/script && break
            sleep 1
          done
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9333/json/version && break
            sleep 1
          done
          # The library list, the editor (outline/centre/inspector), the preview mock, and one
          # state behind an interaction: the inspector with a draw rule selected.
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script --viewports 1366x768,1920x1080
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/1245/edit --viewports 1366x768,1920x1080
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/playback/preview --viewports 1366x768,1920x1080
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/edit --prepare bin/audit/open-draw-rule.js --viewports 1366x768,1920x1080
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/bank --viewports 1366x768,1920x1080
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/draws --viewports 1366x768,1920x1080
          # A phone width as well: the editor stacks its three columns below 820 px and the bank below
          # 1100 px, and the shell hides its own overflow, so a screen that does not fit or does not
          # reflow shows up here (plan §11.14).
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script --viewports 390x844
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/1245/edit --viewports 390x844
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/edit --viewports 390x844
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/bank --viewports 390x844
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/draws --viewports 390x844
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/playback/preview --viewports 390x844
          # ui-spec's house rule covers light *and* dark: the same routes again with the opt-in dark
          # scheme switched on (`bin/audit/use-dark-scheme.js`), which is where the link token and the
          # timeline's hatch were failing before §11.13.
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/1245/edit --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/playback/preview --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/edit --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/bank --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/theme_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/draws --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          # The machine-checkable part of ui-spec §8: accessible names, labels, ARIA relationships,
          # tree/radiogroup semantics, tab order and 44 px target sizes, on the same routes.
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/1245/edit --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/playback/preview --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/edit --prepare bin/audit/open-draw-rule.js --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/bank --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/draws --viewports 1366x768
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/1245/source --viewports 1366x768
          # The same routes in the dark scheme: the house rule covers both, and a scheme changes
          # which surfaces the colours land on.
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/bank-draw/draws --viewports 1366x768 --prepare bin/audit/use-dark-scheme.js
          # The editor at a phone width: the columns stack there, and the tab order must follow.
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script/1245/edit --viewports 390x844
          node bin/a11y_audit.mjs --url http://127.0.0.1:4300/project/Demo1/script --viewports 390x844

  dry-run:
    name: Recorder dry run (Chrome, fake media)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # The driver drives the production bundle, so this job also proves the app build.
      - name: Build the recorder
        run: npm run build
      # The receiver serves the built bundle and creates session 1 from the fixture script; Chrome
      # feeds it a fake media stream. One step, because a background process does not survive the
      # end of the step that started it.
      - name: Drive a session end to end
        run: |
          set -e
          # Chrome will not advance an audio clip's clock without an output device, so no prompt clip
          # can play; the recorder reports that as a failure rather than stalling on it (it bounds
          # the wait). Give the runner a null sink so the clip-relative checks are checked here too.
          # Best effort: without it the driver measures the frozen clock, drives the run anyway and
          # marks those checks unverified instead of blaming the recorder (bin/audit/dry_run.mjs).
          if ! pactl info > /dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq pulseaudio > /dev/null 2>&1 || true
          fi
          pulseaudio --start --exit-idle-time=-1 --disallow-exit > /dev/null 2>&1 || true
          pactl load-module module-null-sink sink_name=null_out > /dev/null 2>&1 || true
          pactl set-default-sink null_out > /dev/null 2>&1 || true
          node server/server.mjs --port 8391 --data /tmp/dryrun --seed src/test \
            --app dist/cavox/browser --project Demo1 --script playback --quiet > /tmp/receiver.log 2>&1 &
          google-chrome --headless=new --remote-debugging-port=9333 --user-data-dir=/tmp/cdp-dry \
            --use-fake-ui-for-media-stream --use-fake-device-for-media-stream \
            --autoplay-policy=no-user-gesture-required about:blank > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf -o /dev/null http://127.0.0.1:8391/api/v1/version && break
            sleep 1
          done
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9333/json/version && break
            sleep 1
          done
          # The recorder's own screens, which the editor-scoped audit job never renders: the token,
          # contrast, type-size and layout rules apply to them too (the redesign is shared), and the
          # *logo* rules — loaded, alt text, height, inside the viewport — only ever fire here, on the
          # recorder's control bar (plan §11.26).
          node bin/theme_audit.mjs --url http://127.0.0.1:8391/spr/session/1 --viewports 1366x768
          node bin/theme_audit.mjs --url http://127.0.0.1:8391/ --viewports 1366x768
          # The recorder's screens against the rules that hold anywhere — names, labels, ids, alt,
          # ARIA, the tree, tab order, nesting, a quiet console. The editor's house rules (44 px
          # targets, one h1, one main) are scoped out: the recorder predates them (plan §11.28).
          node bin/a11y_audit.mjs --url http://127.0.0.1:8391/spr/session/1 --viewports 1366x768 --rules universal
          node bin/a11y_audit.mjs --url http://127.0.0.1:8391/ --viewports 1366x768 --rules universal
          # The stage's instruction line, and which marks the branding slots actually show, measured
          # rather than eyeballed: the tool exits non-zero when the line sits off the header's centre
          # beyond a pixel, when a page has no stage, or when a page overflows its viewport.
          node bin/layout_probe.mjs --url http://127.0.0.1:8391/spr/session/1 --viewports 1568x986,1280x800
          node bin/audit/dry_run.mjs --base http://127.0.0.1:8391 --port 9333 --session 1
