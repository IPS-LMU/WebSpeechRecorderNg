<section class="outline" [attr.aria-label]="strings.editor.outlineRegion">
  <div class="filter-row">
    <label class="filter">
      <span>{{ strings.outline.filterLabel }}</span>
      <input type="search" autocomplete="off" [placeholder]="strings.outline.filterPlaceholder"
             [value]="filter()" (input)="onFilterInput($any($event.target).value)">
    </label>
    @if (filter() !== '') {
      <button type="button" class="clear" [title]="strings.outline.clearFilterTitle"
              (click)="clearFilter()">{{ strings.outline.clearFilter }}</button>
    }
  </div>

  @if (visible().length === 0) {
    <p class="no-match" role="status">{{ strings.outline.noMatch }}</p>
  } @else {
    <div class="list" role="tree" [attr.aria-label]="strings.outline.virtualScrollLabel"
         (keydown)="onKeydown($event)">
      @if (virtual()) {
        <cdk-virtual-scroll-viewport itemSize="64" class="viewport">
          <ng-container *cdkVirtualFor="let row of visible(); trackBy: trackKey">
            <ng-container [ngTemplateOutlet]="rowTpl" [ngTemplateOutletContext]="{$implicit: row}"/>
          </ng-container>
        </cdk-virtual-scroll-viewport>
      } @else {
        @for (row of visible(); track row.key) {
          <ng-container [ngTemplateOutlet]="rowTpl" [ngTemplateOutletContext]="{$implicit: row}"/>
        }
      }
    </div>
  }
</section>

<ng-template #rowTpl let-row>
  <div class="row" [style.padding-left.px]="row.level * 16">
    <button type="button" class="row-main" [id]="rowId(row)"
            [attr.aria-current]="isCurrent(row) ? 'true' : null"
            [tabindex]="focusKey() === row.key ? 0 : -1"
            (click)="choose(row)" (focus)="focusKey.set(row.key)">
      <span class="row-label">{{ row.label }}</span>
      @if (row.secondary !== '') {
        <span class="row-secondary">{{ row.secondary }}</span>
      }
      <span class="markers">
        @if (row.markers.drawn; as drawn) {
          <span class="marker" [title]="markerTitle('drawn')">
            <svg class="icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <rect x="1.5" y="1.5" width="13" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="5.2" cy="5.2" r="1.1" fill="currentColor"/>
              <circle cx="10.8" cy="5.2" r="1.1" fill="currentColor"/>
              <circle cx="5.2" cy="10.8" r="1.1" fill="currentColor"/>
              <circle cx="10.8" cy="10.8" r="1.1" fill="currentColor"/>
            </svg>
            <span class="marker-text">{{ drawnText(drawn) }}</span>
          </span>
        }
        @if (row.markers.training) {
          <span class="chip" [title]="markerTitle('training')">{{ strings.outline.training }}</span>
        }
        @if (row.markers.playsMedia) {
          <span class="marker" [attr.aria-label]="markerTitle('playsMedia')" [title]="markerTitle('playsMedia')">
            <svg class="icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path d="M2 5.5h2.5L8 2.5v11L4.5 10.5H2z" fill="currentColor"/>
              <path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.7a6 6 0 0 1 0 8.6"
                    fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </span>
        }
        @if (row.markers.warning) {
          <span class="marker warning" [attr.aria-label]="markerTitle('warning')" [title]="markerTitle('warning')">
            <svg class="icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path d="M8 1.6 15 14H1z" fill="currentColor"/>
              <path d="M8 5.6v4.1M8 11.6v.1" stroke="var(--spr-surface)" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </span>
        }
      </span>
    </button>
    <span class="reorder">
      <button type="button" [disabled]="true" [title]="strings.outline.reorderTitle"
              [attr.aria-label]="strings.outline.moveUp">↑</button>
      <button type="button" [disabled]="true" [title]="strings.outline.reorderTitle"
              [attr.aria-label]="strings.outline.moveDown">↓</button>
    </span>
  </div>
</ng-template>
