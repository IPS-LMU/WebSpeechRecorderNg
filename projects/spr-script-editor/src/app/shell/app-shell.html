<header class="toolbar">
  <a class="brand" routerLink="/" [attr.aria-label]="strings.shell.homeLabel">{{ strings.shell.brand }}</a>

  <nav class="breadcrumb" [attr.aria-label]="strings.shell.breadcrumbLabel">
    @if (project(); as projectId) {
      <a [routerLink]="['/project', projectId, 'script']">{{ projectId }}</a>
      @if (scriptId(); as id) {
        <span aria-hidden="true">{{ strings.shell.separator }}</span>
        <span class="here">{{ strings.shell.scriptWord }} {{ id }}</span>
      }
    }
  </nav>

  <span class="spacer"></span>

  <p class="save-state" role="status">{{ strings.shell.saveState }}</p>
  <p class="warning-count" [attr.aria-label]="strings.shell.warningLabel">{{ strings.shell.warningCount }}</p>

  <div class="actions">
    <button type="button" [disabled]="true" [title]="strings.shell.readOnlyReason"
            [attr.aria-label]="strings.shell.undo">{{ strings.shell.undo }}</button>
    <button type="button" [disabled]="true" [title]="strings.shell.readOnlyReason"
            [attr.aria-label]="strings.shell.redo">{{ strings.shell.redo }}</button>
    <button type="button" [disabled]="true" [title]="strings.shell.readOnlyReason"
            [attr.aria-label]="strings.shell.preview">{{ strings.shell.preview }}</button>
    <button type="button" class="primary" [disabled]="true" [title]="strings.shell.readOnlyReason"
            [attr.aria-label]="strings.shell.publish">{{ strings.shell.publish }}</button>
  </div>
</header>

<main class="content">
  <router-outlet></router-outlet>
</main>

<p class="read-only-note">{{ strings.shell.readOnlyReason }}</p>
