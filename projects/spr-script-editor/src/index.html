<!doctype html>
<html lang="en" style="height:100%; margin: 0; padding: 0;">
<head>
  <meta charset="utf-8">
  <title>SpeechRecorder script editor</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2A4765">
  <!-- No icon asset: an empty data URI keeps the request out of the log instead of a 404. -->
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap">
  <style>
    /* Shown until the application boots. Offline deployments fall back to the system font stack. */
    spre-app-shell > .spr-boot {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: var(--spr-page, #EEF1F5);
    }

    spre-app-shell > .spr-boot h1 {
      font-family: var(--spr-font-family, Inter, "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif);
      font-size: var(--spr-type-section, 17.28px);
      font-weight: 700;
      color: var(--spr-ink-strong, #1C3660);
      margin: 0;
    }
  </style>
</head>
<body style="height:100%; margin: 0; padding: 0;">

<spre-app-shell class="mat-typography"><div class="spr-boot"><h1>Loading script editor…</h1></div></spre-app-shell>

</body>
</html>
