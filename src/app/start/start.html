<section class="spr-start">
  <span class="spr-start-badge">{{ 'app.start.badge' | transloco }}</span>
  <h1 class="spr-start-title">{{ 'app.start.titleLine1' | transloco }}<br>{{ 'app.start.titleLine2' | transloco }}</h1>
  <p class="spr-start-lead">{{ 'app.start.lead' | transloco }}</p>
  <div class="spr-start-actions">
    <a mat-raised-button class="spr-start-cta" [routerLink]="openRecorderLink">{{ 'app.start.openRecorder' | transloco }}</a>
  </div>
</section>
