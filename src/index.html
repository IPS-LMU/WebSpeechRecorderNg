<!doctype html>
<html lang="sv" translate="no" style="height:100%; margin: 0;padding: 0">
<head>
  <meta charset="utf-8">
  <title>Cavox — Capture your voice</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2A4765">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap">
  <style>
    /* Shown until the application boots. Offline deployments fall back to the system
       font stack — see the Theme section of the README. */
    app-root > .spr-boot h1 {
      font-family: var(--spr-font-family, Inter, "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif);
      font-size: var(--spr-type-section, 17.28px);
      font-weight: 700;
      color: var(--spr-ink-strong, #1C3660);
      margin: 0;
    }

    app-root > .spr-boot {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: var(--spr-page, #EEF1F5);
    }
  </style>
</head>
<body style="height:100%; margin: 0;padding: 0">

<app-root class="mat-typography"><div class="spr-boot"><h1>Laddar Cavox… vänta.</h1></div></app-root>

<script>
  /* Before the application boots there is no translator: localize the placeholder and the document
     language from the stored choice, resolving it exactly as `initialLanguage()` does (see
     `src/app/i18n/i18n.providers.ts`), so an English user never sees a Swedish flash. Swedish is
     the default, so the markup above is already Swedish; this only switches to English for an
     explicit `en` choice. The application repeats both at bootstrap; this covers the window
     before it runs. */
  (function () {
    try {
      var stored = localStorage.getItem('spr.lang');
      var preferred = (stored || (navigator.language || 'sv')).slice(0, 2).toLowerCase();
      if (preferred !== 'en') return;
      document.documentElement.setAttribute('lang', 'en');
      var splash = document.querySelector('app-root > .spr-boot h1');
      if (splash) splash.textContent = 'Loading Cavox… please wait.';
    } catch (e) { /* storage unavailable (private mode) — keep the default */ }
  })();
</script>

</body>
</html>
